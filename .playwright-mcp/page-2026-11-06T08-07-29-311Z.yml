      - generic [ref=f3e97]:
        - paragraph [ref=f3e98]: Published on 2 October 2026
        - paragraph [ref=f3e99]:
          - strong [ref=f3e100]:
            - emphasis [ref=f3e101]: Could AI bring rehabilitation beyond the clinic? NUHS is evaluating AISay to support recovery at home while complementing therapists’ care.
        - paragraph [ref=f3e102]: Between therapy sessions, patients practising speech exercises at home may be unsure whether they are using the techniques correctly.
        - paragraph [ref=f3e103]:
          - text: AISay, an artificial intelligence (AI) app being developed by the
          - link "National University Health System (NUHS)" [ref=f3e104] [cursor=pointer]:
            - /url: https://www.nuhs.edu.sg/
          - text: ", in collaboration with Synapxe, aims to bridge this gap by providing feedback during independent practice and recording patients’ progress for therapists to review."
        - paragraph [ref=f3e105]: Designed for people with dysarthria, a condition that can occur after a stroke and affect speech clarity, AISay could help extend rehabilitation beyond scheduled appointments. This gives patients more opportunities to practise while keeping therapists connected to their progress.
        - paragraph [ref=f3e106]:
          - text: For
          - link "Dr Elvina Tay" [ref=f3e107] [cursor=pointer]:
            - /url: https://www.nuhs.edu.sg/patient-care/find-a-doctor/doctor-details/Elvina_Tay
          - text: ", Consultant, Department of Post-Acute & Continuing Care,"
          - link "Jurong Community Hospital (JCH)" [ref=f3e108] [cursor=pointer]:
            - /url: https://www.jch.com.sg/
          - text: ", this support could begin even before patients return home. AISay can help patients make use of time outside scheduled therapy sessions for additional practice in hospital, and continue that practice after discharge."
        - heading "Building speech habits through practice" [level=2] [ref=f3e109]
        - paragraph [ref=f3e110]:
          - text: For speech exercises to be effective, patients need to apply the techniques introduced by their therapist. “Dysarthria rehab is essentially about forming new habits in response to unclear speech,” explained Mr Jarrod Lee, Speech Therapist,
          - link "Ng Teng Fong General Hospital (NTFGH)" [ref=f3e111] [cursor=pointer]:
            - /url: https://www.ntfgh.com.sg/
          - text: .
        - paragraph [ref=f3e112]: For instance, someone working on clearer pronunciation may focus only on slowing down. Without feedback on how they are forming the words, repeated practice may reinforce an approach that does not address the difficulty being targeted.
        - img [ref=f3e113]:
          - generic [ref=f3e114]: “Without timely feedback, it can be difficult to know whether they are doing the exercises correctly. As a result, practice often becomes less frequent or less structured.”
          - generic [ref=f3e115]: – Dr Elvina Tay
        - paragraph [ref=f3e122]: AISay is designed to provide guidance at these points of uncertainty. In its early version, patients say a sentence aloud and receive simple feedback to guide their next attempt. Their practice and progress are also recorded for their therapist to review.
        - heading "Connecting practice at home with care" [level=2] [ref=f3e123]
        - paragraph [ref=f3e124]: The information collected between appointments could give therapists a clearer picture of how patients are practising in their daily lives.
        - paragraph [ref=f3e125]: Thereafter, therapists can review practice frequency and duration, the feedback provided by AISay, speech recordings and progress reports. These insights will help to identify areas of difficulty and adjust exercises or practice sentences during subsequent sessions.
        - img [ref=f3e126]:
          - generic [ref=f3e127]: This contributes to our in-personsessions being more targeted andallows us to make adjustments totheir practice sentences.
          - generic [ref=f3e128]: – Mr Jarrod Lee
        - paragraph [ref=f3e135]: However, technology does not replace the therapist’s role. As Dr Tay explained, therapists will continue to assess patients, set their rehabilitation goals and tailor therapy to each individual’s needs”.
        - heading "Supporting recovery beyond supervised sessions" [level=2] [ref=f3e136]
        - paragraph [ref=f3e137]: With this support in place, AISay could give patients more opportunities to practise independently while allowing therapists to focus on areas that require direct clinical input.
        - img [ref=f3e138]:
          - generic [ref=f3e139]: “Not every practice session requires direct supervision. When patients can continue structured rehabilitation independently between therapist-led sessions, they receive more opportunities to practise.”
          - generic [ref=f3e140]: – Dr Elvina Tay
        - paragraph [ref=f3e147]: Speech therapists will have more time to support patients who require specialised care, such as assessment and management of swallowing difficulties.
        - paragraph [ref=f3e148]: The approach reflects NUHS’ Healthcare Workforce of the Future focus on using technology to support care delivery and make better use of healthcare professionals’ time. Rather than replacing therapist-led rehabilitation, AI could help extend the reach of care into the time between appointments and into patients’ homes.
        - paragraph [ref=f3e149]: For Dr Tay, her vision is for rehabilitation to become part of patients’ everyday lives, “so that every opportunity to practise becomes another opportunity to recover”.
        - paragraph [ref=f3e150]:
          - strong [ref=f3e151]:
            - text: In consultation with
            - link "Dr Elvina Tay" [ref=f3e152] [cursor=pointer]:
              - /url: https://www.nuhs.edu.sg/patient-care/find-a-doctor/doctor-details/Elvina_Tay
            - text: ", Consultant, Department of Post-Acute & Continuing Care, JCH, and Clin Asst Prof, Department of Medicine, NUS Yong Loo Lin School of Medicine (NUS Medicine); and Mr Jarrod Lee, Speech Therapist, NTFGH."
