      - generic [ref=f6e98]:
        - paragraph [ref=f6e99]: Published on 28 October 2021
        - paragraph [ref=f6e100]: Vaccine-related myocarditis is a rare side effect of the mRNA COVID-19 vaccine. Most people who develop this condition have mild symptoms and recover without long-lasting issues.
        - paragraph [ref=f6e101]: To avoid aggravating this condition in those at risk, the Ministry of Health (MOH) has recommended that people should avoid strenuous physical activity for two weeks after receiving either of their mRNA Covid-19 vaccination doses.
        - img [ref=f6e102]:
          - generic [ref=f6e105]:
            - generic [ref=f6e107]: How do I determine the physical activities to avoid?
            - generic [ref=f6e190]: VACCINE
            - generic [ref=f6e193]: RISK
            - generic [ref=f6e194]: for mRNA vaccines in the US (Comparable to the risk of anaphylaxis observed in Singapore)
            - generic [ref=f6e207]: mRNA
            - generic [ref=f6e238]: TO DATE
            - generic [ref=f6e325]:
              - text: "Low Intensity:"
              - generic [ref=f6e326]: You can walk and sing while exercising without feeling out of breath.
            - generic [ref=f6e327]:
              - text: "High Intensity:"
              - generic [ref=f6e328]: 70% to 85% MHR (OR you are unable to speak in complete sentence during the workout)
            - generic [ref=f6e329]:
              - text: Examples of high intensity exercises to avoid
              - generic [ref=f6e330]: •Circuit training•Vigorous forms of weight training•Sprinting•Increasing the distance of
              - generic [ref=f6e331]: swimming
            - generic [ref=f6e332]:
              - text: Examples of light intensity exercises to consider
              - generic [ref=f6e333]: •Stretching•Light walking•Housework
            - generic [ref=f6e340]:
              - text: "Moderate Intensity:"
              - generic [ref=f6e341]: 50-70% of your maximum heart rate (MHR), calculated by 220 - Age
            - generic [ref=f6e342]:
              - text: Examples of moderate intensity exercises to avoid
              - generic [ref=f6e343]: •Weight training•Brisk walking•Slow jog (5-6km/hr)•Cycling•Swimming
        - paragraph [ref=f6e348]:
          - strong [ref=f6e349]: What is Myocarditis?
        - paragraph [ref=f6e350]: Myocarditis is the inflammation of the heart muscle. This happens when the body's immune system causes inflammation in response to an infection or some other trigger, such as a vaccine response.
        - paragraph [ref=f6e351]: "Signs of myocarditis include:"
        - list [ref=f6e352]:
          - listitem [level=1] [ref=f6e353]: Chest pain
          - listitem [level=1] [ref=f6e354]: Shortness of breath
          - listitem [level=1] [ref=f6e355]: Feelings of having a fast-beating, fluttering, or pounding heart
        - paragraph [ref=f6e356]: Seek medical attention if you are experiencing any of these symptoms within the week after your COVID-19 vaccination.
        - paragraph [ref=f6e357]:
          - strong [ref=f6e358]: Is the mRNA COVID-19 vaccine safe?
        - paragraph [ref=f6e359]: With the very low risk of myocarditis, vaccination is still safe. The known and potential benefits of COVID-19 vaccination outweigh the known and potential risks of vaccination. COVID-19 is more likely to lead to illness, and severe complications as well as long-term health problems, hospitalisation, and even death. Those who develop myocarditis generally respond well to treatment. If you have concerns about COVID-19 vaccination, talk with your doctor about the best option and management of risks.
        - paragraph [ref=f6e360]:
          - strong [ref=f6e361]:
